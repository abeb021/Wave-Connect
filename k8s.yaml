# --- API GATEWAY ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway
        image: gateway-service:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_SECRET
          value: "super_secret_jwt_key_dev"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8081"
        - name: CHAT_SERVICE_URL
          value: "http://chat-service:8082"
        - name: FEED_SERVICE_URL
          value: "http://feed-service:8083"
        - name: PROFILE_SERVICE_URL
          value: "http://profile-service:8084"
        ports:
        - containerPort: 8080
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080

