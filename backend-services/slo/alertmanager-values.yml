# values для чарта prometheus-community/alertmanager (ДЗ №6).
#
#   helm upgrade --install alertmanager prometheus-community/alertmanager \
#     -n monitoring -f slo/alertmanager-values.yml
#
# Конфиг встроен inline. Чарт игнорирует existingSecret (не монтирует его),
# поэтому config.config — это готовый alertmanager.yml целиком.
#
# Сайдкар configmapReload выключен: конфиг статичный, а стандартный образ
# quay падает с "add directory /etc/alertmanager to watcher" и уводит под
# в CrashLoopBackOff.

replicaCount: 1
image:
  repository: quay.io/prometheus/alertmanager
  tag: v0.27.0
config:
  enabled: false
extraVolumes:
- name: am-config
  secret:
    secretName: alertmanager-config
extraVolumeMounts:
- name: am-config
  mountPath: /etc/alertmanager/alertmanager.yml
  subPath: alertmanager.yml
  readOnly: true
configmapReload:
  enabled: false
persistence:
  enabled: true
  size: 1Gi
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
service:
  type: ClusterIP
  port: 9093
nodeSelector: {}
tolerations: []
affinity: {}
